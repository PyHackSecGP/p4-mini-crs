{% extends "base.html" %}
{% block title %}Manual trigger — P4 Mini-CRS{% endblock %}
{% block content %}

<h2>Manual trigger</h2>
<p class="muted">Enqueue a target directly. Dedup against pending/running jobs is automatic.</p>

<form method="post">
  <label for="target">Target directory (absolute path to C source)</label>
  <input type="text" id="target" name="target" placeholder="/home/tony/projects/p4-mini-crs/targets/vulnerable_parser" required>

  <label for="fuzz_time">Fuzz time (seconds)</label>
  <input type="number" id="fuzz_time" name="fuzz_time" value="60" min="10" max="3600">

  <button type="submit">Enqueue</button>
</form>

{% endblock %}
